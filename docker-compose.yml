services:
  redis:
    image: redis/redis-stack-server:7.4.0-v2
    container_name: multiagent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: "--requirepass redispwd"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redispwd ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    container_name: multiagent-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  redisinsight-data: